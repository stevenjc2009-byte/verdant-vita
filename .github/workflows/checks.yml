name: Updater checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  updater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test staging and offline tools
        run: |
          python3 tools/check_vita_assets.py
          python3 tests/updater_test.py
          python3 tests/performance_test.py
          python3 tests/native_transport_test.py
          python3 tests/offline_tools_test.py
      - name: Test native update recovery
        run: |
          gcc -O1 -g -fsanitize=address,undefined -Isource/core -Isource/platform/host tests/update_apply_test.c -lcrypto -o /tmp/verdant-update-test
          ASAN_OPTIONS=detect_leaks=0 python3 tests/update_apply_test.py /tmp/verdant-update-test
          gcc -O1 -g -fsanitize=address,undefined -Isource/core tests/setup_test.c -lcrypto -o /tmp/verdant-setup-test
          ASAN_OPTIONS=detect_leaks=0 python3 tests/setup_test.py /tmp/verdant-setup-test
          gcc -O1 -g -fsanitize=address,undefined tests/vita_frame_test.c -lpthread -o /tmp/verdant-frame-test
          /tmp/verdant-frame-test
      - name: Test calculator and native release checks
        run: |
          python3 tests/currency_test.py
          python3 tests/agent_mailbox_test.py
          gcc -O1 -g -fsanitize=address,undefined tests/calculator_test.c -lm -o /tmp/verdant-calculator-test
          /tmp/verdant-calculator-test
          gcc -O1 -g -fsanitize=address,undefined tests/native_check_test.c -o /tmp/verdant-native-check-test
          check_dir=$(mktemp -d)
          cd "$check_dir"
          /tmp/verdant-native-check-test
