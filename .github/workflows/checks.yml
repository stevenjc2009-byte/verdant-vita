name: Updater checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  updater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test staging and offline tools
        run: |
          python3 tools/check_vita_assets.py
          python3 tests/updater_test.py
          python3 tests/performance_test.py
          python3 tests/native_transport_test.py
          python3 tests/offline_tools_test.py
      - name: Test native update recovery
        run: |
          gcc -O1 -g -fsanitize=address,undefined -Isource/core -Isource/platform/host tests/update_apply_test.c -lcrypto -o /tmp/verdant-update-test
          ASAN_OPTIONS=detect_leaks=0 python3 tests/update_apply_test.py /tmp/verdant-update-test
          gcc -O1 -g -fsanitize=address,undefined -Isource/core tests/setup_test.c -lcrypto -o /tmp/verdant-setup-test
          ASAN_OPTIONS=detect_leaks=0 python3 tests/setup_test.py /tmp/verdant-setup-test
          gcc -O1 -g -fsanitize=address,undefined tests/vita_frame_test.c -lpthread -o /tmp/verdant-frame-test
          /tmp/verdant-frame-test
      - name: Test calculator and native release checks
        run: |
          python3 tests/currency_test.py
          python3 tests/agent_mailbox_test.py
          gcc -O1 -g -fsanitize=address,undefined tests/calculator_test.c -lm -o /tmp/verdant-calculator-test
          /tmp/verdant-calculator-test
          gcc -O1 -g -fsanitize=address,undefined tests/native_check_test.c -o /tmp/verdant-native-check-test
          check_dir=$(mktemp -d)
          cd "$check_dir"
          /tmp/verdant-native-check-test
      - name: Test Vita core, clock, native storage and small updates
        run: |
          gcc -O1 -g -fsanitize=address,undefined tests/vita_clock_test.c -o /tmp/verdant-clock-test
          /tmp/verdant-clock-test
          gcc -O1 -g -fsanitize=address,undefined tests/vita_network_start_test.c -o /tmp/verdant-network-test
          /tmp/verdant-network-test
          gcc -O1 -g -fsanitize=address,undefined tests/native_files_test.c -lpthread -o /tmp/verdant-files-test
          files_dir=$(mktemp -d)
          (cd "$files_dir" && /tmp/verdant-files-test)
          gcc -O1 -g -fsanitize=address,undefined -DVERDANT_APPLY_VITA -Isource/core -Isource/platform/host tests/update_apply_test.c -lcrypto -o /tmp/verdant-apply-vita-test
          ASAN_OPTIONS=detect_leaks=0 python3 tests/fast_update_test.py /tmp/verdant-apply-vita-test
      - name: Test actual desktop touch and keyboard layouts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev zlib1g-dev
          gcc -O1 -g -fsanitize=address,undefined -DVERDANT_TEST_VITA -Isource/core -Isource/platform -Isource/platform/host -Ivendor/mini-rv32ima-mmu -Ivendor/ctr-osk-rt/include -Ivendor/ctr-osk-rt/source tests/desktop_test.c source/platform/host/plat.c vendor/ctr-osk-rt/source/ctrosk.c vendor/ctr-osk-rt/source/ctrosk_gfx.c -lcurl -lz -lcrypto -lpthread -lm -o /tmp/verdant-desktop-test
          desktop_dir=$(mktemp -d)
          (cd "$desktop_dir" && ASAN_OPTIONS=detect_leaks=0 /tmp/verdant-desktop-test)
      - name: Test native games
        run: |
          gcc -O1 -g -fsanitize=address,undefined tests/games_test.c -o /tmp/verdant-games-test
          /tmp/verdant-games-test
      - name: Test Notepad document editing
        run: |
          gcc -O1 -g -fsanitize=address,undefined tests/editor_test.c -o /tmp/verdant-editor-test
          /tmp/verdant-editor-test
